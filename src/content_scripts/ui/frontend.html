<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" href="frontend.css">
    <link rel="stylesheet" href="../content.css">
</head>
<body>
    <style id="sk_theme">
/* 光标闪烁动画 - 平滑渐变效果 */
@keyframes cursorBlink {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
}

/* Visual mode 光标样式增强 */
div.surfingkeys_cursor {
    animation: cursorBlink 1.2s ease-in-out infinite !important;
    min-height: 30px !important;
    min-width: 8px !important;
    transition: all 0.1s ease !important;
}

/* 当光标为空时（Caret 模式），确保可见 */
div.surfingkeys_cursor:empty {
    min-width: 10px !important;
    min-height: 30px !important;
}

.sk_theme input {
    font-family: "JetBrains Mono";
}
.sk_theme .url {
    font-size: 11px;
}
#sk_omnibarSearchResult li div.url {
    font-weight: normal;
}
.sk_theme .omnibar_timestamp {
    font-size: 12px;
    font-weight: bold;
}
#sk_omnibarSearchArea input {
    font-size: 14px;
}
.sk_theme .omnibar_visitcount {
    font-size: 12px;
    font-weight: bold;
}
body {
    font-family: "JetBrains Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
}
kbd {
    font: 11px "JetBrains Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace;
}
#sk_omnibarSearchArea .prompt, #sk_omnibarSearchArea .resultPage {
    font-size: 14px;
}
.sk_theme {
    background: #fcfcfc;
    color: #5c6166;
}
.sk_theme tbody {
    color: #f07171;
}
.sk_theme input {
    color: #55b4d4;
}
.sk_theme .url {
    color: #8a9199;
}
#sk_omnibarSearchResult>ul>li {
    background: #fcfcfc;
    border: none !important;
    margin: 0 !important;
    padding: 2px 8px !important;
}
#sk_omnibarSearchResult ul li:nth-child(odd) {
    background: #f5f5f5;
}
.sk_theme #sk_omnibarSearchResult ul li:nth-child(odd) {
    background: #f5f5f5;
}
#sk_omnibarSearchResult ul li .favIcon {
    vertical-align: middle;
    margin-right: 4px;
}
.sk_theme .annotation {
    color: #8a9199;
}
.sk_theme .focused {
    background: #ebedef !important;
}
.sk_theme kbd {
    background: #ebedef;
    color: #5c6166;
}
.sk_theme .frame {
    background: #ebedefDD;
}
.sk_theme .omnibar_highlight {
    color: #22a4e6;
}
.sk_theme .omnibar_folder {
    color: #a37acc;
}
.sk_theme .omnibar_timestamp {
    color: #55b4d4;
}
.sk_theme .omnibar_visitcount {
    color: #ffaa33;
}

.sk_theme .prompt, .sk_theme .resultPage {
    color: #86b300;
}
.sk_theme .feature_name {
    color: #f07171;
}
.sk_omnibar_middle #sk_omnibarSearchArea {
    border-bottom: 1px solid #d9dadb;
}
#sk_status {
    border: 1px solid #d9dadb;
}
#sk_richKeystroke {
    background: #fcfcfc;
    box-shadow: 0px 2px 10px rgba(231, 232, 233, 0.8);
}
#sk_richKeystroke kbd>.candidates {
    color: #f07171;
}
#sk_keystroke {
    background-color: #fcfcfc;
    color: #5c6166;
}
kbd {
    border: solid 1px #5c6166;
    border-bottom-color: #5c6166;
    box-shadow: inset 0 -1px 0 #5c6166;
}
#sk_frame {
    border: 4px solid #f07171;
    background: #ebedefDD;
    box-shadow: 0px 0px 10px #f07171DD;
}
#sk_banner {
    border: 1px solid #d9dadb;
    background: #f0f0f1;
}
div.sk_tabs_bg {
    background: #5c6166;
}
div.sk_tab {
    background: #fcfcfc;
    border: none !important;
}
div.sk_tab:nth-child(odd) {
    background: #f5f5f5;
    border: none !important;
}
div.sk_tab {
    display: flex !important;
    align-items: center !important;
}
div.sk_tab:not(:has(.sk_tab_hint)) .sk_tab_wrap {
    margin-left: 42px !important;
}
div.sk_tab_wrap {
    display: flex !important;
    align-items: center !important;
    flex: 1 1 auto !important;
    min-width: 0 !important;
    overflow: hidden !important;
}
div.sk_tab_title {
    color: #5c6166;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    flex: 1 1 auto !important;
    min-width: 0 !important;
}
div.sk_tab_url {
    color: #22a4e6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
div.sk_tab_hint {
    background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#ffaa33), color-stop(100%,#fa8d3e));
    color: #fcfcfc;
    border: solid 1px #ed9366;
    min-width: 24px;
    text-align: center;
    display: inline-block;
}
#sk_bubble {
    border: 1px solid #5c6166;
    color: #fcfcfc;
    background-color: #5c6166;
}
#sk_bubble * {
    color: #fcfcfc !important;
}
div.sk_arrow[dir=down]>div:nth-of-type(1) {
    border-top: 12px solid #5c6166;
}
div.sk_arrow[dir=up]>div:nth-of-type(1) {
    border-bottom: 12px solid #5c6166;
}
div.sk_arrow[dir=down]>div:nth-of-type(2) {
    border-top: 10px solid #5c6166;
}
div.sk_arrow[dir=up]>div:nth-of-type(2) {
    border-bottom: 10px solid #5c6166;
}
#sk_omnibar {
    width: 100%;
    left: 0%;
}
.sk_theme .separator {
    color: #8a9199;
}
.sk_theme #sk_omnibarSearchResult>ul>li.window {
    border: none;
    border-radius: 0;
    margin: 0;
}
.sk_theme #sk_omnibarSearchResult>ul>li.window.focused {
    border: none;
}
.expandRichHints span.annotation {
    padding-left: 4px;
    color: #22a4e6;
}
.expandRichHints kbd>.candidates {
    color: #f07171;
    font-weight: bold;
}
#sk_usage .feature_name>span {
    border-bottom: 2px solid #8a9199;
}
div.sk_tab_group {
    font-size: large;
    color: #5c6166;
    padding: 4px;
    border: none;
    border-radius: 0;
    margin: 10px;
    display: inline-block;
    background: #fcfcfc;
}
#sk_find {
    background: #fcfcfc;
    color: #5c6166;
}
.sk_cursor_prompt {
    background: #fcfcfc;
}
.sk_cursor_prompt>div {
    border-bottom: 1px solid #d9dadb;
}
.sk_cursor_prompt>div.selected {
    background: #55b4d4;
    color: #fcfcfc;
}
div.surfingkeys_match_mark {
    background-color: #FFFF00;
    opacity: 1 !important;
    mix-blend-mode: multiply !important;
}
div.surfingkeys_selection_mark {
    background-color: #FF9632;
    opacity: 1 !important;
    mix-blend-mode: multiply !important;
}
#sk_tabs {
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    max-height: 90vh;
    max-width: 90vw;
}
#sk_tabs.vertical div.sk_tab_hint {
    position: static !important;
    left: auto !important;
}
#sk_tabs.horizontal div.sk_tab_hint {
    float: left !important;
}</style>
    <div id=sk_omnibar class="sk_theme" style="display: none;">
        <style>
        </style>
        <div id=sk_omnibarSearchArea>
            <span class="prompt"></span>
            <span class="resultPage"></span>
        </div>
        <div id=sk_omnibarSearchResult></div>
    </div>
    <div id=sk_status class="sk_theme" style="display: none;">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div id=sk_usage class=sk_theme style="display: none;">
    </div>
    <div id=sk_popup class=sk_theme style="display: none;">
    </div>
    <div id=sk_editor style="display: none;">
    </div>
    <div id=sk_nvim style="display: none;">
    </div>
    <div id=sk_tabs style="display: none;">
    </div>
    <div id=sk_banner style="display: none;">
    </div>
    <div id=sk_bubble class=sk_theme style="display: none;">
        <div class=sk_bubble_content></div>
        <div class=sk_arrow style="position: absolute; top: 100%">
            <div></div>
            <div></div>
        </div>
    </div>
    <div id=sk_keystroke class=sk_theme style="display: none;">
    </div>
    <script src="frontend.js"></script>
</body>
</html>
